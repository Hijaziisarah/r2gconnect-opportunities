body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f5f4fb;color:#1a1a2e;min-height:100vh}

.hero{background:linear-gradient(135deg,#5a5fcc 0%,#898dfa 100%);padding:40px 24px 32px;text-align:center;color:#fff}

.fsel.av{border-color:#5a5fcc;color:#5a5fcc}

.msel{position:relative}

.mselbtn:hover{border-color:#898dfa;color:#5a5fcc}
.mselbtn.av{border-color:#5a5fcc;color:#5a5fcc;font-weight:600}

// Recalculate days_left dynamically from today's date
(function(){
  var today = new Date();
  today.setHours(0,0,0,0);
  var months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  opps.forEach(function(o){
    var parts = o.deadline.split(' ');
    if(parts.length === 3){
      var d = parseInt(parts[0],10);
      var m = months[parts[1]];
      var y = parseInt(parts[2],10);
      if(!isNaN(d) && m !== undefined && !isNaN(y)){
        var dl = new Date(y, m, d);
        dl.setHours(0,0,0,0);
        o.days_left = Math.round((dl - today) / 86400000);
      }
    }
  });
})();
// ---- Filter state (multi-select) ----
var aF=new Set();      // selected types (empty = all)
var aUrgent=false;     // closing-soon toggle
var aP=new Set();      // selected partners
var aC=new Set();      // selected categories
var aSub=new Set();    // selected subcategories
var aS='dl-asc';
var aQ='';

function getSorted(arr){
  var a=arr.slice();
  if(aS==='dl-asc')return a.sort(function(x,y){return x.days_left-y.days_left;});
  if(aS==='dl-desc')return a.sort(function(x,y){return y.days_left-x.days_left;});
  if(aS==='az')return a.sort(function(x,y){return x.title.localeCompare(y.title);});
  if(aS==='za')return a.sort(function(x,y){return y.title.localeCompare(x.title);});
  if(aS==='type'){
    var ord={'Partnership Opportunity':0,'Discovery Track':1,'Expert Cohort':2,'Expert Services':3,'Deal':4};
    return a.sort(function(x,y){return (ord[x.type]||9)-(ord[y.type]||9);});
  }
  return a;
}

function getFiltered(){
  var r=opps.filter(function(o){return o.days_left>=0;});
  if(aUrgent)r=r.filter(function(o){return o.days_left<=7;});
  if(aF.size)r=r.filter(function(o){return aF.has(o.type);});
  if(aP.size)r=r.filter(function(o){return aP.has(o.partner);});
  if(aC.size)r=r.filter(function(o){return o.cats.some(function(c){return aC.has(c);});});
  if(aSub.size)r=r.filter(function(o){return o.subs.some(function(s){return aSub.has(s);});});
  if(aQ){
    var q=aQ.toLowerCase();
    r=r.filter(function(o){
      return o.title.toLowerCase().indexOf(q)>=0
        ||o.partner.toLowerCase().indexOf(q)>=0
        ||o.type.toLowerCase().indexOf(q)>=0
        ||o.cats.some(function(c){return c.toLowerCase().indexOf(q)>=0;})
        ||o.subs.some(function(s){return s.toLowerCase().indexOf(q)>=0;});
    });
  }
  return r;
}

function bclass(t){
  if(t==='Discovery Track')return 'ba';
  if(t==='Deal')return 'bd';
  if(t==='Expert Services')return 'bg';
  if(t==='Partnership Opportunity')return 'bpa';
  if(t==='Expert Cohort')return 'be';
  return 'bd';
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function card(o){
  var urgent=o.days_left<=7;
  var soon=o.days_left>7&&o.days_left<=30;
  var urgTxt=urgent?o.days_left+'d left':(soon?o.days_left+'d left':'');
  var dlCls=(urgent||soon)?' soon':'';
  var ctags=o.cats.slice(0,3).map(function(c){return '<span class="ctag">'+esc(c)+'</span>';}).join('');
  var stags=o.subs.slice(0,3).map(function(s){return '<span class="stag">'+esc(s)+'</span>';}).join('');
  var h='<div class="card" data-url="'+esc(o.url)+'" tabindex="0">';
  h+='<div class="card-top">';
  h+='<div class="badges"><span class="badge '+bclass(o.type)+'">'+esc(o.type)+'</span>';
  if(urgent)h+='<span class="badge bu">⚡ Closing Soon</span>';
  h+='</div>';
  h+='<div class="card-title">'+esc(o.title)+'</div>';
  h+='<div class="card-partner"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg> '+esc(o.partner)+'</div>';
  h+='</div>';
  if(ctags||stags)h+='<div class="tags">'+ctags+stags+'</div>';
  h+='<div class="card-meta">';
  h+='<span class="dl'+dlCls+'"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg> '+esc(o.deadline)+(urgTxt?' &middot; <strong>'+urgTxt+'</strong>':'')+'</span>';
  h+='<a class="cta" href="'+esc(o.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>';
  h+='</div></div>';
  return h;
}

function render(){
  var f=getSorted(getFiltered());
  var grid=document.getElementById('grid');
  var lbl=document.getElementById('rlabel');
  var activeCount=opps.filter(function(o){return o.days_left>=0;}).length;
  document.getElementById('total-count').textContent=f.length;
  var urgentN=opps.filter(function(o){return o.days_left>=0&&o.days_left<=7;}).length;
  document.getElementById('urgent-count').textContent='⚡ '+urgentN;
  if(!f.length){
    grid.innerHTML='<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg><p style="margin-top:10px">No opportunities match your filters.</p></div>';
    lbl.textContent='';
    return;
  }
  grid.innerHTML=f.map(card).join('');
  lbl.textContent='Showing '+f.length+' of '+activeCount+' opportunities';
  grid.querySelectorAll('.card').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.closest('a'))return;
      var u=this.getAttribute('data-url');
      if(u)window.open(u,'_blank','noopener');
    });
  });
}

// ---- Multi-select dropdown widget (Partner / Category / Subcategory) ----
var MSEL_LABELS={psel:'All Partners',csel:'All Categories',ssel:'All Subcategories'};
var MSEL_NOUN_PLURAL={psel:'Partners',csel:'Categories',ssel:'Subcategories'};
var MSEL_SETS={psel:aP,csel:aC,ssel:aSub};

function mselLabel(id){
  var set=MSEL_SETS[id];
  var btn=document.getElementById(id+'-btn');
  if(set.size===0){
    btn.textContent=MSEL_LABELS[id];
    btn.classList.remove('av');
  } else if(set.size===1){
    btn.textContent=Array.from(set)[0];
    btn.classList.add('av');
  } else {
    btn.textContent=set.size+' '+MSEL_NOUN_PLURAL[id]+' selected';
    btn.classList.add('av');
  }
}

function initMsel(id){
  var btn=document.getElementById(id+'-btn');
  var panel=document.getElementById(id+'-panel');
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    var wasOpen=panel.classList.contains('open');
    document.querySelectorAll('.msel-panel.open').forEach(function(p){p.classList.remove('open');});
    if(!wasOpen)panel.classList.add('open');
  });
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var set=MSEL_SETS[id];
      if(cb.checked)set.add(cb.value);else set.delete(cb.value);
      mselLabel(id);
      updateURL();
      render();
    });
  });
  panel.querySelector('[data-clear]').addEventListener('click',function(e){
    e.stopPropagation();
    MSEL_SETS[id].clear();
    panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){cb.checked=false;});
    mselLabel(id);
    updateURL();
    render();
  });
  panel.querySelector('[data-close]').addEventListener('click',function(e){
    e.stopPropagation();
    panel.classList.remove('open');
  });
}
['psel','csel','ssel'].forEach(initMsel);
document.addEventListener('click',function(){
  document.querySelectorAll('.msel-panel.open').forEach(function(p){p.classList.remove('open');});
});

function setMselFromValues(id,values){
  var set=MSEL_SETS[id];
  set.clear();
  values.forEach(function(v){set.add(v);});
  var panel=document.getElementById(id+'-panel');
  panel.querySelectorAll('input[type=checkbox]').forEach(function(cb){
    cb.checked=set.has(cb.value);
  });
  mselLabel(id);
}

// ---- URL <-> filter state sync ----
function updateURL(){
  var params=new URLSearchParams();
  if(aF.size)params.set('type',Array.from(aF).join(','));
  if(aUrgent)params.set('urgent','1');
  if(aS&&aS!=='dl-asc')params.set('sort',aS);
  if(aP.size)params.set('partner',Array.from(aP).join(','));
  if(aC.size)params.set('category',Array.from(aC).join(','));
  if(aSub.size)params.set('sub',Array.from(aSub).join(','));
  if(aQ)params.set('q',aQ);
  var qs=params.toString();
  var newUrl=window.location.pathname+(qs?'?'+qs:'');
  try{
    window.history.replaceState(null,'',newUrl);
  }catch(e){
    // Some sandboxed/preview contexts (e.g. srcdoc iframes) don't allow
    // rewriting the URL. Filters still work; only the shareable-link
    // address bar update is skipped in that context. Once this file is
    // hosted on a real URL (GitHub Pages, Netlify, etc.) this succeeds normally.
  }
}

function loadFromURL(){
  var params=new URLSearchParams(window.location.search);
  var hasAny=false;
  if(params.has('type')){
    hasAny=true;
    params.get('type').split(',').filter(Boolean).forEach(function(t){aF.add(t);});
    document.querySelectorAll('.fbtn[data-f]').forEach(function(x){
      var f=x.getAttribute('data-f');
      if(f!=='all'&&f!=='urgent')x.classList.toggle('active',aF.has(f.slice(2)));
    });
    if(aF.size)document.querySelector('.fbtn[data-f="all"]').classList.remove('active');
  }
  if(params.has('urgent')){
    hasAny=true;
    aUrgent=true;
    document.querySelector('.fbtn[data-f="urgent"]').classList.add('active');
  }
  if(params.has('sort')){
    aS=params.get('sort');
    document.getElementById('sort').value=aS;
  }
  if(params.has('partner')){
    hasAny=true;
    setMselFromValues('psel',params.get('partner').split(',').filter(Boolean));
  }
  if(params.has('category')){
    hasAny=true;
    setMselFromValues('csel',params.get('category').split(',').filter(Boolean));
  }
  if(params.has('sub')){
    hasAny=true;
    setMselFromValues('ssel',params.get('sub').split(',').filter(Boolean));
  }
  if(params.has('q')){
    hasAny=true;
    aQ=params.get('q');
    document.getElementById('sinp').value=aQ;
  }
  if(hasAny && window.innerWidth<=640){
    fb.classList.add('open');
    chev.style.transform='rotate(180deg)';
    document.getElementById('ftoggle').setAttribute('aria-expanded','true');
  }
}

var fb=document.getElementById('fb');
var chev=document.getElementById('chev');
document.getElementById('ftoggle').addEventListener('click',function(){
  if(window.innerWidth>640)return;
  var open=fb.classList.toggle('open');
  chev.style.transform=open?'rotate(180deg)':'';
  this.setAttribute('aria-expanded',open);
});

document.querySelectorAll('.fbtn[data-f]').forEach(function(b){
  b.addEventListener('click',function(){
    var f=this.getAttribute('data-f');
    if(f==='all'){
      aF.clear();
      document.querySelectorAll('.fbtn[data-f]').forEach(function(x){
        if(x.getAttribute('data-f')!=='urgent')x.classList.remove('active');
      });
      this.classList.add('active');
    } else if(f==='urgent'){
      aUrgent=!aUrgent;
      this.classList.toggle('active',aUrgent);
    } else {
      var typeName=f.slice(2); // strip "t:" prefix
      if(aF.has(typeName)){aF.delete(typeName);this.classList.remove('active');}
      else{aF.add(typeName);this.classList.add('active');}
      document.querySelector('.fbtn[data-f="all"]').classList.toggle('active',aF.size===0);
    }
    updateURL();
    render();
  });
});

document.getElementById('sort').addEventListener('change',function(){
  aS=this.value;
  updateURL();
  render();
});

var sinpTimer;
document.getElementById('sinp').addEventListener('input',function(){
  aQ=this.value.trim();
  clearTimeout(sinpTimer);
  sinpTimer=setTimeout(updateURL,400);
  render();
});

loadFromURL();
render();
})();
</script>
